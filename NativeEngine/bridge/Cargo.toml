[package]
name = "grainroom-spectral"
version = "0.2.0"
edition.workspace = true
license = "GPL-3.0-only"

[lib]
name = "grainroom_spectral"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
spektrafilm-core = { workspace = true, features = ["precision-f64"] }
spektrafilm-math = { workspace = true, features = ["precision-f64"] }
spektrafilm-gpu = { workspace = true, default-features = false, features = ["precision-f64"] }
serde_json.workspace = true
rayon.workspace = true
